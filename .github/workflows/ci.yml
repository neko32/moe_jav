name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (pedantic)
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Live-service tests are #[ignore]d; everything here runs offline
      # against stubs and a local wiremock server.
      - name: tests with coverage (>= 90% lines)
        run: cargo llvm-cov --fail-under-lines 90 --ignore-filename-regex 'main\.rs' --html --output-dir target/coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: app/target/coverage/html

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
