<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Results summary (run 3). Palette: tanunekolab portfolio neutrals; series colors
       #4f7cbb (Jev) / #b9772f (LLM) validated with the dataviz palette checker (all checks pass). -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="56" y="70" font-size="36" font-weight="300" fill="#1a1a1a">Calibration decides how much human review you need</text>
  <text x="56" y="106" font-size="18" fill="#666666">Raising the gate threshold τ: wrong routes that still slip through vs. share of segments sent to a human</text>
  <rect x="56" y="124" width="64" height="2" fill="#7297c5"/>

  <!-- Legend -->
  <g font-size="15" fill="#1a1a1a">
    <rect x="96" y="176" width="22" height="3" fill="#4f7cbb"/><circle cx="107" cy="177.5" r="5" fill="#4f7cbb" stroke="#ffffff" stroke-width="2"/>
    <text x="128" y="182">Jev gate (decision model, calibrated)</text>
    <rect x="430" y="176" width="22" height="3" fill="#b9772f"/><circle cx="441" cy="177.5" r="5" fill="#b9772f" stroke="#ffffff" stroke-width="2"/>
    <text x="462" y="182">LLM gate (Gemma 4 E4B, self-reported confidence)</text>
  </g>

  <!-- Plot area: x 96..1000 (0..25 %), y 760..280 (0..4 misroutes) -->
  <g stroke="#eeeeee" stroke-width="1">
    <line x1="96" y1="280" x2="1000" y2="280"/>
    <line x1="96" y1="400" x2="1000" y2="400"/>
    <line x1="96" y1="520" x2="1000" y2="520"/>
    <line x1="96" y1="640" x2="1000" y2="640"/>
  </g>
  <line x1="96" y1="760" x2="1000" y2="760" stroke="#999999" stroke-width="1"/>
  <g font-size="14" fill="#666666" text-anchor="end">
    <text x="84" y="765">0</text>
    <text x="84" y="645">1</text>
    <text x="84" y="525">2</text>
    <text x="84" y="405">3</text>
    <text x="84" y="285">4</text>
  </g>
  <g font-size="14" fill="#666666" text-anchor="middle">
    <text x="96" y="788">0%</text>
    <text x="276.8" y="788">5%</text>
    <text x="457.6" y="788">10%</text>
    <text x="638.4" y="788">15%</text>
    <text x="819.2" y="788">20%</text>
    <text x="1000" y="788">25%</text>
  </g>
  <text x="548" y="822" font-size="15" fill="#666666" text-anchor="middle">share of the 160 segments sent to human review</text>
  <text x="30" y="520" font-size="15" fill="#666666" text-anchor="middle" transform="rotate(-90 30 520)">misroutes that slip through</text>

  <!-- Target zone: zero misroutes -->
  <rect x="96" y="748" width="904" height="12" fill="#4f7cbb" fill-opacity="0.07"/>

  <!-- LLM series -->
  <polyline points="96,280 118.6,280 186.4,400 887,640" fill="none" stroke="#b9772f" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#b9772f" stroke="#ffffff" stroke-width="2">
    <circle cx="96" cy="280" r="6"/>
    <circle cx="118.6" cy="280" r="6"/>
    <circle cx="186.4" cy="400" r="6"/>
    <circle cx="887" cy="640" r="7"/>
  </g>

  <!-- Jev series -->
  <polyline points="96,400 118.6,520 163.8,640 186.4,640 254.2,760 276.8,760 412.4,760" fill="none" stroke="#4f7cbb" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#4f7cbb" stroke="#ffffff" stroke-width="2">
    <circle cx="96" cy="400" r="6"/>
    <circle cx="118.6" cy="520" r="6"/>
    <circle cx="163.8" cy="640" r="6"/>
    <circle cx="186.4" cy="640" r="6"/>
    <circle cx="254.2" cy="760" r="7"/>
    <circle cx="276.8" cy="760" r="6"/>
    <circle cx="412.4" cy="760" r="6"/>
  </g>

  <!-- Selective point labels (τ) -->
  <g font-size="13" fill="#666666">
    <text x="132" y="270">τ 0.5–0.9</text>
    <text x="198" y="395">τ 0.95</text>
    <text x="110" y="396">τ 0.5</text>
  </g>

  <!-- Annotations -->
  <line x1="254.2" y1="752" x2="300" y2="690" stroke="#1a1a1a" stroke-width="1"/>
  <text x="306" y="684" font-size="15" font-weight="600" fill="#1a1a1a">Jev at τ 0.9: 0 misroutes</text>
  <text x="306" y="704" font-size="14" fill="#666666">7 segments (4.4%) sent to a human</text>

  <line x1="887" y1="632" x2="840" y2="560" stroke="#1a1a1a" stroke-width="1"/>
  <text x="996" y="534" font-size="15" font-weight="600" fill="#1a1a1a" text-anchor="end">LLM at τ 0.99: 1 misroute left</text>
  <text x="996" y="554" font-size="14" fill="#666666" text-anchor="end">35 segments (22%) sent to a human</text>

  <!-- Right column: headline tiles -->
  <rect x="1080" y="166" width="464" height="176" fill="#f8f8f8"/>
  <text x="1104" y="200" font-size="13" font-weight="600" fill="#999999" letter-spacing="1">ACCURACY ON GOLD SEGMENTS</text>
  <text x="1104" y="256" font-size="44" font-weight="300" fill="#1a1a1a">98.1% <tspan font-size="24" fill="#999999">vs</tspan> 97.5%</text>
  <text x="1104" y="290" font-size="15" fill="#666666">Jev vs. LLM: accuracy alone</text>
  <text x="1104" y="312" font-size="15" fill="#666666">doesn't separate them</text>

  <rect x="1080" y="362" width="464" height="176" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="1080" y="362" width="4" height="176" fill="#4f7cbb"/>
  <text x="1104" y="396" font-size="13" font-weight="600" fill="#4f7cbb" letter-spacing="1">JEV GATE · τ = 0.9</text>
  <text x="1104" y="452" font-size="44" font-weight="300" fill="#1a1a1a">0 misroutes</text>
  <text x="1104" y="486" font-size="15" fill="#666666">Its mistakes came with low confidence</text>
  <text x="1104" y="508" font-size="15" fill="#666666">(0.56–0.86), so the gate caught them all</text>

  <rect x="1080" y="558" width="464" height="176" fill="#ffffff" stroke="#e5e5e5"/>
  <rect x="1080" y="558" width="4" height="176" fill="#b9772f"/>
  <text x="1104" y="592" font-size="13" font-weight="600" fill="#b9772f" letter-spacing="1">LLM GATE · τ = 0.99</text>
  <text x="1104" y="648" font-size="44" font-weight="300" fill="#1a1a1a">1 misroute</text>
  <text x="1104" y="682" font-size="15" fill="#666666">Its mistakes came at 0.90–1.00 confidence,</text>
  <text x="1104" y="704" font-size="15" fill="#666666">so no threshold stops them all</text>

  <!-- Footer band -->
  <rect x="0" y="852" width="1600" height="48" fill="#f8f8f8"/>
  <text x="56" y="882" font-size="13" fill="#999999">40 synthetic applications · 160 hand-labelled segments · same routing rubric for both gates · run 3</text>
  <text x="1544" y="882" font-size="13" fill="#999999" text-anchor="end">github.com/neko32/moe_jav</text>
</svg>
